services:
  postgres:
    image: postgres:16-alpine
    container_name: nexpharm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexpharm_user
      POSTGRES_PASSWORD: nexpharm_secure_password_2026
      POSTGRES_DB: nexpharm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexpharm_user -d nexpharm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexpharm_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://nexpharm_user:nexpharm_secure_password_2026@postgres:5432/nexpharm_db
      - JWT_SECRET=nexpharm_enterprise_super_secret_jwt_key_2026_change_in_production
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - MODEL_PATH=/app/ml/models
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ml/models:/app/ml/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexpharm_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
